<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <h1 class="text-xl font-black tracking-wider text-sky-400">ΔΙΑΧΕΙΡΙΣΗ</h1>
            <nav class="mt-8 space-y-2">
                <a href="#" class="flex items-center space-x-3 bg-slate-800 text-white p-3 rounded-lg font-medium transition">
                    <span>📋</span>
                    <span>Προϊόντα & Κατηγορίες</span>
                </a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <div class="text-xs text-slate-500">Έκδοση 2.5 (Accordion)</div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shrink-0">
            <h2 class="text-2xl font-bold text-slate-900">Store Management</h2>
            <div class="flex items-center space-x-4">
                <span class="text-sm bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-medium border border-emerald-200">Online</span>
            </div>
        </header>

        <div class="p-8 max-w-5xl w-full mx-auto">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6 flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-semibold text-slate-900">Δομή Καταλόγου</h3>
                    <p class="text-slate-500 text-sm">Διαχειριστείτε τις κατηγορίες και τα προϊόντα σας.</p>
                </div>
            </div>

            <div id="productsList" class="space-y-4">
                <div class="animate-pulse bg-white p-5 rounded-xl border border-slate-200 flex justify-between">
                    <div class="h-4 bg-slate-200 rounded w-1/3"></div>
                    <div class="h-4 bg-slate-200 rounded w-1/12"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="editModal" style="display: none;" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-slate-100">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900">Επεξεργασία Προϊόντος</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="editForm" class="p-6 space-y-4">
                <input type="hidden" id="editProductId">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Όνομα Προϊόντος (GR):</label>
                    <input type="text" id="editName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Τιμή (€):</label>
                    <input type="number" step="0.01" id="editPrice" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div class="flex space-x-3 pt-4 border-t border-slate-100 mt-6">
                    <button type="submit" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm">Αποθήκευση</button>
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition">Ακύρωση</button>
                </div>
            </form>
        </div>
    </div>

    <div id="addModal" style="display: none;" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-slate-100">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900">Νέο Προϊόν</h3>
                <button type="button" onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="addForm" class="p-6 space-y-4">
                <input type="hidden" id="addCategoryName">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Όνομα Προϊόντος (GR):</label>
                    <input type="text" id="addName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Τιμή (€):</label>
                    <input type="number" step="0.01" id="addPrice" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div class="flex space-x-3 pt-4 border-t border-slate-100 mt-6">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm">Προσθήκη</button>
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition">Ακύρωση</button>
                </div>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
