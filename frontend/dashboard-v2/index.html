<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between hidden md:flex shrink-0">
        <div class="p-6">
            <h1 class="text-xl font-black tracking-wider text-sky-400">ΔΙΑΧΕΙΡΙΣΗ</h1>
            <nav class="mt-8 space-y-3">
                <a href="../shop/index.html" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white p-3 rounded-lg font-medium transition">
                    <span class="text-lg">🏪</span> <span>Το Κατάστημα μου</span>
                </a>
                <a href="../categories/index.html" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white p-3 rounded-lg font-medium transition">
                    <span class="text-lg">📁</span> <span>Διαχείριση Κατηγοριών</span>
                </a>
                <a href="#" class="flex items-center space-x-3 bg-slate-800 text-white p-3 rounded-lg font-medium transition">
                    <span class="text-lg">🍔</span> <span>Προϊόντα & Μενού</span>
                </a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800"><div class="text-xs text-slate-500">Έκδοση 3.0 (Dynamic)</div></div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-slate-900">Store Management</h2>
            <span class="text-sm bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-medium border border-emerald-200">Online</span>
        </header>

        <div class="p-8 max-w-5xl w-full mx-auto space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Επιλέξτε Κατάστημα:</label>
                    <select id="restaurantSelect" class="w-full px-3 py-2 border rounded-lg bg-white"></select>
                </div>
                <button type="button" onclick="openRestaurantModal()" class="bg-sky-600 text-white py-2 px-4 rounded-lg mt-6">➕ Νέο Κατάστημα</button>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 flex justify-between items-center">
                <div><h3 class="text-lg font-semibold">Δομή Καταλόγου</h3></div>
                <button type="button" onclick="openCategoryModal()" class="bg-indigo-600 text-white py-2 px-4 rounded-lg">➕ Νέα Κατηγορία</button>
            </div>
            <div id="productsList" class="space-y-4"></div>
        </div>
    </main>

    <div id="restaurantModal" class="hidden fixed inset-0 bg-slate-900/40 z-50 justify-center items-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold mb-4">Νέο Κατάστημα</h3>
            <form id="restaurantForm" class="space-y-4">
                <input type="text" id="resName" placeholder="Όνομα" class="w-full border p-2 rounded-lg" required>
                <input type="text" id="resAddress" placeholder="Διεύθυνση" class="w-full border p-2 rounded-lg" required>
                <input type="text" id="resPhone" placeholder="Τηλέφωνο" class="w-full border p-2 rounded-lg" required>
                <input type="email" id="resEmail" placeholder="Email" class="w-full border p-2 rounded-lg" required>
                <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg">Δημιουργία</button>
            </form>
        </div>
    </div>

    <div id="categoryModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-slate-100">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900">Δημιουργία Νέας Κατηγορίας</h3>
                <button type="button" onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="categoryForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Όνομα Κατηγορίας:</label>
                    <input type="text" id="catName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex space-x-3 pt-4 border-t border-slate-100">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition">Δημιουργία</button>
                    <button type="button" onclick="closeCategoryModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition">Ακύρωση</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="hidden fixed inset-0 bg-slate-900/40 z-50 justify-center items-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold mb-4">Επεξεργασία Προϊόντος</h3>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editProductId">
                <input type="hidden" id="editCategoryId">
                <input type="text" id="editName" placeholder="Όνομα Προϊόντος" class="w-full border p-2 rounded-lg">
                <textarea id="editDescription" placeholder="Περιγραφή" class="w-full border p-2 rounded-lg"></textarea>
                <input type="number" step="0.01" id="editPrice" placeholder="Τιμή" class="w-full border p-2 rounded-lg">
                <button type="submit" class="w-full bg-sky-600 text-white py-2 rounded-lg">Αποθήκευση</button>
            </form>
        </div>
    </div>

    <div id="addModal" class="hidden fixed inset-0 bg-slate-900/40 z-50 justify-center items-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold mb-4">Νέο Προϊόν</h3>
            <form id="addForm" class="space-y-4">
                <input type="hidden" id="addCategoryName">
                <input type="text" id="addName" placeholder="Όνομα Προϊόντος" class="w-full border p-2 rounded-lg">
                <textarea id="addDescription" placeholder="Περιγραφή" class="w-full border p-2 rounded-lg"></textarea>
                <input type="number" step="0.01" id="addPrice" placeholder="Τιμή" class="w-full border p-2 rounded-lg">
                <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg">Προσθήκη</button>
            </form>
        </div>
    </div>

    <script>
        function openRestaurantModal() { const m = document.getElementById("restaurantModal"); if (m) { m.classList.remove("hidden"); m.classList.add("flex"); } }
        function closeRestaurantModal() { const m = document.getElementById("restaurantModal"); if (m) { m.classList.remove("flex"); m.classList.add("hidden"); } }
        function openCategoryModal() {
            const select = document.getElementById("restaurantSelect");
            if (!select || !select.value) { alert("Παρακαλώ επιλέξτε πρώτα ένα κατάστημα!"); return; }
            const m = document.getElementById("categoryModal");
            if (m) { m.classList.remove("hidden"); m.classList.add("flex"); }
        }
        function closeCategoryModal() { const m = document.getElementById("categoryModal"); if (m) { m.classList.remove("flex"); m.classList.add("hidden"); } }
        function openAddModal(catId) { document.getElementById("addCategoryName").value = catId; const m = document.getElementById("addModal"); if (m) { m.classList.remove("hidden"); m.classList.add("flex"); } }
        function closeAddModal() { const m = document.getElementById("addModal"); if (m) { m.classList.remove("flex"); m.classList.add("hidden"); } }
    </script>
    <script src="dashboard.js"></script>
</body>
</html>
